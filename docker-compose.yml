services:
  postgres:
    image: postgres:15
    command: postgres -c max_connections=250
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DBS: e_commerce_auth_db,e_commerce_catalog_db,e_commerce_inventory_db,e_commerce_notification_db,e_commerce_order_db,e_commerce_payment_db,e_commerce_welcomenotification_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e-commerce-network

  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e-commerce-network

  auth-service:
    build: ./AuthService
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/e_commerce_auth_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - e-commerce-network

  catalog-service:
    build: ./CatalogService
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/e_commerce_catalog_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SERVER_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e-commerce-network

  inventory-service:
    build: ./InventoryService
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/e_commerce_inventory_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SERVER_PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - e-commerce-network

  order-service:
    build: ./OrderService
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/e_commerce_order_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SERVER_PORT=8083
      - CATALOG_SERVICE_URL=http://catalog-service:8081

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - e-commerce-network

  notification-service:
    build: ./NotificationService
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/e_commerce_notification_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SPRING_MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - AUTH_SERVICE_URL=http://auth-service:8080
      - SERVER_PORT=8084
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - e-commerce-network

  payment-service:
    build: ./PaymentService
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/e_commerce_payment_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SERVER_PORT=8086
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - e-commerce-network

  welcome-notification-service:
    build: ./WelcomeNotificationService
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/e_commerce_welcomenotification_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SPRING_MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - SERVER_PORT=8087
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - e-commerce-network

  bff-service:
    build: ./BFFService
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:8080
      - CATALOG_SERVICE_URL=http://catalog-service:8081
      - ORDER_SERVICE_URL=http://order-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8086
    depends_on:
      - auth-service
      - catalog-service
      - order-service
    networks:
      - e-commerce-network

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - bff-service
    networks:
      - e-commerce-network

  health-grpc:
    build: ./HealthGrpc
    ports:
      - "50052:50052"   # gRPC
      - "8088:8088"     # HTTP JSON health endpoint
    environment:
      - HEALTH_GRPC_PORT=50052
      - HEALTH_HTTP_PORT=8088
      - HEALTH_TARGETS=http://auth-service:8080,http://catalog-service:8081,http://inventory-service:8082,http://order-service:8083,http://notification-service:8084,http://payment-service:8086,http://welcome-notification-service:8087,tcp://postgres:5432
      - HEALTH_INTERVAL_SECONDS=10
      - HEALTH_TIMEOUT_SECONDS=3
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - order-service
      - notification-service
      - payment-service
      - welcome-notification-service
      - postgres
    networks:
      - e-commerce-network
  invoice-service:
    build: ./InvoiceService
    environment:
      - POSTGRES_DB=invoice_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e-commerce-network

networks:
  e-commerce-network:
    driver: bridge

volumes:
  postgres_data: