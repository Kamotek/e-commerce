spring.config.import=optional:file:../global-config.yml

spring.application.name=BFFService

# service endpoints - prefer explicit env vars set by docker-compose, fallback to internal service names
auth.service.url=${services.AuthService.url:${AUTH_SERVICE_URL:http://auth-service:8080}}
catalog.service.url=${services.CatalogService.url:${CATALOG_SERVICE_URL:http://catalog-service:8081}}
order.service.url=${services.OrderService.url:${ORDER_SERVICE_URL:http://order-service:8083}}
payment.service.url=${services.PaymentService.url:${PAYMENT_SERVICE_URL:http://payment-service:8086}}

# Datasource (can be provided per-service by docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/e_commerce_bff_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ - prefer full address env or default to rabbitmq:5672
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESS:amqp://rabbitmq:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
spring.rabbitmq.ssl.enabled=false

logging.level.org.springframework.security=DEBUG

# server port can be set by docker-compose
server.port=${SERVER_PORT:8085}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always