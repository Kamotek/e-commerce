spring.config.import=optional:file:../global-config.yml

spring.application.name=NotificationService

# server port can be set by docker-compose
server.port=${SERVER_PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/e_commerce_notification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESS:amqp://rabbitmq:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
spring.rabbitmq.ssl.enabled=false

# Mail settings - prefer SPRING_MAIL_* then MAIL_* from .env; final fallback to Gmail SMTP defaults
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

auth.service.url=${services.AuthService.url:${AUTH_SERVICE_URL:http://auth-service:8080}}

logging.level.org.springframework=INFO
logging.level.com.yourorg.notification=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.notificationservice=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always