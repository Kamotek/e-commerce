apiVersion: apps/v1
kind: Deployment
metadata:
  name: welcome-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: welcome-notification-service
  template:
    metadata:
      labels:
        app: welcome-notification-service
    spec:
      containers:
        - name: welcome-notification-service
          image: welcomenotificationservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/e_commerce_welcomenotification_db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-password
            - name: SERVER_PORT
              value: "8087"