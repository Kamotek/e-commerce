apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-grpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-grpc
  template:
    metadata:
      labels:
        app: health-grpc
    spec:
      containers:
        - name: health-grpc
          image: healthgrpc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/e_commerce_health_db"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_USERNAME
              value: guest
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: rabbitmq-password
            - name: SERVER_PORT
              value: "8088"